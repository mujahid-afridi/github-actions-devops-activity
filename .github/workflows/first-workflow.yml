
name: First GitHub Actions Workflow

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [custom-webhook]

jobs:
  basic-check:
    runs-on: ubuntu-latest
    steps:
      - name: Show workflow contexts
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Actor: ${{ github.actor }}"
          echo "Event: ${{ github.event_name }}"
          echo "Runner OS: ${{ runner.os }}"
          echo "Workflow: ${{ github.workflow }}"

      - name: Run on success
        if: success()
        run: echo "Previous steps succeeded."

      - name: Check event type
        if: contains(github.event_name, 'push')
        run: echo "This workflow was triggered by a push event."

      - name: Always run this step
        if: always()
        run: echo "This step runs regardless of earlier step outcomes."

      - name: Read repository variable
        run: |
          echo "Application environment: ${{ vars.APP_ENV }}"

      - name: Verify secret is configured
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          if [ -n "$DEMO_SECRET" ]; then
            echo "Demo secret is configured."
          else
            echo "Demo secret is missing."
            exit 1
          fi
          
  windows-check:
    runs-on: windows-latest
    steps:
      - name: Show Windows runner information
        run: |
          Write-Host "Runner OS: ${{ runner.os }}"
          Write-Host "Running on Windows successfully."

  macos-check:
    runs-on: macos-latest
    steps:
      - name: Show macOS runner information
        run: |
          echo "Runner OS: ${{ runner.os }}"
          echo "Running on macOS successfully."

  
  self-hosted-check:
    runs-on: self-hosted
    steps:
      - name: Verify self-hosted runner
        run: echo "This job is running on my own computer!"

      - name: Show runner information
        run: |
          echo "Runner name: ${{ runner.name }}"
          echo "Runner OS: ${{ runner.os }}"
  
  
  matrix-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache a sample directory
        uses: actions/cache@v4
        with:
          path: cache-demo
          key: demo-cache-${{ runner.os }}-node-${{ matrix.node-version }}

      - name: Create sample cache data
        run: |
          mkdir -p cache-demo
          echo "Cached data for Node.js ${{ matrix.node-version }}" > cache-demo/data.txt
          cat cache-demo/data.txt

      - name: Display Node.js version
        run: node --version
  
  postgres-service:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: devops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d devops_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check PostgreSQL connection
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: devops_test
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          pg_isready
          psql -c "SELECT version();"
          psql -c "CREATE TABLE activity (id SERIAL PRIMARY KEY, message TEXT);"
          psql -c "INSERT INTO activity (message) VALUES ('Service container works');"
          psql -c "SELECT * FROM activity;"
  
  custom-action-test:
    runs-on: ubuntu-latest
    steps:
      - name: Run custom greeting action
        uses: mujahid-afridi/my-custom-github-action@v1.0.0
        with:
          name: "DevOps Student"








name: First GitHub Actions Workflow

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [custom-webhook]
    
jobs:
  basic-check:
    runs-on: ubuntu-latest
    steps:
      - name: Show workflow contexts
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Actor: ${{ github.actor }}"
          echo "Event: ${{ github.event_name }}"
          echo "Runner OS: ${{ runner.os }}"
          echo "Workflow: ${{ github.workflow }}"
          
      - name: Run on success
        if: success()
        run: echo "Previous steps succeeded."

      - name: Check event type
        if: contains(github.event_name, 'push')
        run: echo "This workflow was triggered by a push event."

      - name: Always run this step
        if: always()
        run: echo "This step runs regardless of earlier step outcomes."
